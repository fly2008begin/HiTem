[env:m5cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default_8MB.csv
board_build.f_cpu = 240000000L
build_src_filter = +<main/*> +<shared/*>
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.3
    m5stack/M5Cardputer@^1.1.1
build_flags =
    -DARDUINO_M5STACK_CARDPUTER
    -DBOARD_HAS_PSRAM
    -Isrc/shared

[env:relay]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<../relay/*> +<shared/*>
build_flags =
    -Isrc/shared
    ; Uncomment and modify to customize LED pin and polarity:
    ; -DRELAY_LED_PIN=2          ; LED GPIO pin number
    ; -DRELAY_LED_ACTIVE_HIGH=1   ; 1 = HIGH to turn on, 0 = LOW to turn on
